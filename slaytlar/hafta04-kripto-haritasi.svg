<svg data-crypto-map="usage" xmlns="http://www.w3.org/2000/svg" data-check-layout="diagram" role="img" aria-label="Simetrik: aynı key ile veri şifreleme. Asimetrik: ayrı algoritmalarla şifreleme, dijital imza ve key exchange. Hashing: dosya özeti ve salt'lı parola doğrulama." viewBox="0 0 1664 650" style="display:block;width:100%;height:650px"><title>Simetrik: aynı key ile veri şifreleme. Asimetrik: ayrı algoritmalarla şifreleme, dijital imza ve key exchange. Hashing: dosya özeti ve salt'lı parola doğrulama.</title><rect width="1664" height="650" fill="#0b191b"></rect><rect x="522" y="4" width="620" height="70" rx="18" fill="#122a2d" stroke="#79e2bc" stroke-width="2"></rect><text x="832" y="50" fill="#79e2bc" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="600" text-anchor="middle"><tspan x="832" dy="0">KRİPTOGRAFİ ARAÇLARI</tspan></text><path d="M832 74V94M270 94H1394M270 94V120M832 94V120M1394 94V120" fill="none" stroke="#305052" stroke-width="3"></path><rect x="2" y="120" width="536" height="448" rx="18" fill="#122a2d" stroke="#305052" stroke-width="2"></rect><text x="26" y="169" fill="#79e2bc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="26" dy="0">SİMETRİK ŞİFRELEME</tspan></text><text x="26" y="214" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start"><tspan x="26" dy="0">Aynı secret key</tspan></text><path d="M26 238H514" stroke="#305052" stroke-width="2"></path><rect x="564" y="120" width="536" height="448" rx="18" fill="#122a2d" stroke="#305052" stroke-width="2"></rect><text x="588" y="169" fill="#79e2bc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="588" dy="0">ASİMETRİK YÖNTEMLER</tspan></text><text x="588" y="214" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start"><tspan x="588" dy="0">Public / private key çifti</tspan></text><path d="M588 238H1076" stroke="#305052" stroke-width="2"></path><rect x="1126" y="120" width="536" height="448" rx="18" fill="#122a2d" stroke="#305052" stroke-width="2"></rect><text x="1150" y="169" fill="#79e2bc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="1150" dy="0">HASHING</tspan></text><text x="1150" y="214" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start"><tspan x="1150" dy="0">Tek yönlü özet</tspan></text><path d="M1150 238H1638" stroke="#305052" stroke-width="2"></path><text x="26" y="284" fill="#e4cf8c" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start"><tspan x="26" dy="0">Veriyi şifrele ve geri çöz</tspan></text><text x="26" y="331" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start"><tspan x="26" dy="0">Not · dosya · yedek</tspan></text><text x="26" y="374" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start"><tspan x="26" dy="0">TLS'te uygulama verisi</tspan></text><text x="26" y="441" fill="#e4cf8c" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="start"><tspan x="26" dy="0">AES-GCM</tspan></text><text x="26" y="494" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start"><tspan x="26" dy="0">Alice: K ile şifrele</tspan></text><text x="26" y="535" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start"><tspan x="26" dy="0">Bob: aynı K ile çöz</tspan></text><text x="588" y="284" fill="#e4cf8c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start"><tspan x="588" dy="0">Şifreleme · RSA-OAEP</tspan></text><text x="588" y="320" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="588" dy="0">Bob'a özel bir not gönder.</tspan></text><text x="588" y="380" fill="#e4cf8c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start"><tspan x="588" dy="0">Dijital imza · Ed25519</tspan></text><text x="588" y="416" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="588" dy="0">Güncellemenin yayıncısını doğrula.</tspan></text><text x="588" y="476" fill="#e4cf8c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start"><tspan x="588" dy="0">Key exchange · X25519</tspan></text><text x="588" y="512" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="588" dy="0">Alice ve Bob ortak secret oluştursun.</tspan></text><text x="1150" y="284" fill="#e4cf8c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start"><tspan x="1150" dy="0">Dosya özeti · SHA-256</tspan></text><text x="1150" y="324" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start"><tspan x="1150" dy="0">Dosya değişti mi?</tspan></text><text x="1150" y="390" fill="#e4cf8c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start"><tspan x="1150" dy="0">Parola · Argon2id + salt</tspan></text><text x="1150" y="430" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start"><tspan x="1150" dy="0">Girilen parola doğru mu?</tspan></text><text x="1150" y="505" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start"><tspan x="1150" dy="0">Hash, şifreleme değildir.</tspan></text><text x="1150" y="541" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start"><tspan x="1150" dy="0">Özetten veri geri çözülmez.</tspan></text><text x="832" y="625" fill="#edf6f2" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle"><tspan x="832" dy="0">TLS örneği: kimlik doğrulama + key exchange → simetrik veri şifreleme</tspan></text></svg>